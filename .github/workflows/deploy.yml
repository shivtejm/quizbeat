name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env file
        working-directory: frontend
        run: |
          echo "VITE_FIREBASE_API_KEY=AIzaSyDcFt0oob2OytBYIat3TjRaFwlQ8m8zgJk" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=quizbeat-5ba67.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=quizbeat-5ba67" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=quizbeat-5ba67.firebasestorage.app" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=443998665766" >> .env
          echo "VITE_FIREBASE_APP_ID=1:443998665766:web:1eb16f4c11fa8c8c1dbae7" >> .env
          echo "VITE_FIREBASE_DATABASE_URL=https://quizbeat-5ba67-default-rtdb.asia-southeast1.firebasedatabase.app" >> .env
          echo "VITE_API_URL=https://quizbeat-api.onrender.com" >> .env

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
